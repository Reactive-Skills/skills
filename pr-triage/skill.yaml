schema_version: "2.0.0"
name: "pr-triage"
version: "1.0.0"
description: "Pull request triage workflow that collects PR metadata, classifies risk and ownership, assesses readiness, routes work, and pauses at a human disposition gate."
initial_state: "INTAKE"

middleware:
  hooks:
    - name: telemetry
      trigger: post_transition
      config:
        emitter: stdout
    - name: audit
      trigger: post_transition
      config:
        destination: ".reactive/pr-triage.audit.log"
        redact: []
    - name: invariant_checker
      trigger: post_transition
      config:
        rules_file: "runtime/hooks/invariants.yaml"
        on_violation: halt
    - name: context_sanitizer
      trigger: pre_transition
      config:
        patterns:
          - ".*_TOKEN"
          - ".*_KEY"
          - ".*_SECRET"
          - "password"
          - "api_key"
        replacement: "[REDACTED]"

context_keys:
  - "repository"
  - "pull_requests"
  - "triage_policy"
  - "collected_items"
  - "classifications"
  - "assessments"
  - "routing_plan"
  - "review_decision"
  - "deliverable_path"

default_context:
  repository: null
  pull_requests: []
  triage_policy: null
  collected_items: []
  classifications: []
  assessments: []
  routing_plan: []
  review_decision: null
  deliverable_path: null

states:
  INTAKE:
    description: "Collect repository, pull request batch, and triage policy"
    prompt_template: "states/intake.md"
    tools: ["view_file", "run_command"]
    transitions:
      INTAKE_READY:
        target: "COLLECT"
        guard: "event.payload.repository != null && Array.isArray(event.payload.pull_requests) && event.payload.pull_requests.length > 0 && event.payload.triage_policy != null"
      INTAKE_INVALID:
        target: "ERROR"
        guard: "event.payload.repository == null || !Array.isArray(event.payload.pull_requests) || event.payload.pull_requests.length === 0 || event.payload.triage_policy == null"

  COLLECT:
    description: "Collect PR metadata, checks, reviews, diffs, and ownership signals"
    prompt_template: "states/collect.md"
    model:
      tier: fast
      temperature: 0.1
    tools: ["run_command", "view_file", "grep_search"]
    transitions:
      COLLECTION_COMPLETE:
        target: "CLASSIFY"
        guard: "Array.isArray(event.payload.collected_items) && event.payload.collected_items.length > 0"
      COLLECTION_FAILED:
        target: "ERROR"
        guard: "!Array.isArray(event.payload.collected_items) || event.payload.collected_items.length === 0"

  CLASSIFY:
    description: "Classify each PR by risk, size, ownership, and required reviewer"
    prompt_template: "states/classify.md"
    model:
      tier: balanced
      temperature: 0.1
    tools: ["view_file", "write_to_file"]
    transitions:
      CLASSIFICATION_COMPLETE:
        target: "ASSESS"
        guard: "Array.isArray(event.payload.classifications) && event.payload.classifications.length > 0"
        judgment:
          type: predicate
          criterion: "Array.isArray(payload.classifications) && payload.classifications.length > 0 && payload.classifications.every(item => item && item.risk && item.size && item.owner && Array.isArray(item.reviewer_classes) && item.evidence)"
          min_confidence: 0.85
          fallback_adapter: script
          fallback_target: "CLASSIFY"
      CLASSIFICATION_FAILED:
        target: "ERROR"
        guard: "!Array.isArray(event.payload.classifications) || event.payload.classifications.length === 0"

  ASSESS:
    description: "Assess readiness, risk signals, test status, and policy compliance"
    prompt_template: "states/assess.md"
    model:
      tier: reasoning
      temperature: 0.1
    tools: ["view_file", "grep_search", "run_command"]
    transitions:
      ASSESSMENT_COMPLETE:
        target: "ROUTE"
        guard: "Array.isArray(event.payload.assessments) && event.payload.assessments.length > 0"
        judgment:
          type: predicate
          criterion: "Array.isArray(payload.assessments) && payload.assessments.length > 0 && payload.assessments.every(item => item && item.status && item.evidence)"
          min_confidence: 0.85
          fallback_adapter: script
          fallback_target: "ASSESS"
      ASSESSMENT_FAILED:
        target: "ERROR"
        guard: "!Array.isArray(event.payload.assessments) || event.payload.assessments.length === 0"

  ROUTE:
    description: "Build deterministic routing and disposition recommendations"
    prompt_template: "states/route.md"
    model:
      tier: balanced
      temperature: 0.1
    tools: ["view_file", "write_to_file"]
    transitions:
      ROUTING_COMPLETE:
        target: "REVIEW"
        guard: "Array.isArray(event.payload.routing_plan) && event.payload.routing_plan.length > 0"
        judgment:
          type: predicate
          criterion: "Array.isArray(payload.routing_plan) && payload.routing_plan.length > 0 && payload.routing_plan.every(item => item && item.route && Array.isArray(item.required_actions) && item.evidence)"
          min_confidence: 0.85
          fallback_adapter: script
          fallback_target: "ROUTE"
      ROUTING_FAILED:
        target: "ERROR"
        guard: "!Array.isArray(event.payload.routing_plan) || event.payload.routing_plan.length === 0"

  REVIEW:
    description: "Human gate to approve, rework, or block the triage result"
    prompt_template: "states/review.md"
    tools: ["view_file"]
    human_gate:
      type: "choice"
      tool: "ask_question"
      options:
        - "Approve triage"
        - "Request rework"
        - "Block triage"
    transitions:
      USER_APPROVED:
        target: "SUCCESS"
        guard: "event.payload.approved === true"
      USER_REQUEST_REWORK:
        target: "ASSESS"
        guard: "event.payload.rework_requested === true"
      USER_REJECTED:
        target: "BLOCKED"
        guard: "event.payload.rejected === true"

  SUCCESS:
    description: "Terminal state: PR triage approved"
    prompt_template: "states/success.md"

  BLOCKED:
    description: "Terminal state: PR triage blocked"
    prompt_template: "states/blocked.md"

  ERROR:
    description: "Terminal state: PR triage workflow failed"
    prompt_template: "states/error.md"

deliverable_projections:
  - template: "templates/triage_report.md.hbs"
    output: ".docs/pr-triage/triage-report.md"
    trigger_on: ["STATE_TRANSITION"]
  - template: "templates/state_snapshot.json.hbs"
    output: ".docs/pr-triage/state.json"
    trigger_on: ["STATE_TRANSITION"]
