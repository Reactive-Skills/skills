# Judgment: Voice Standards and Anti-Slop Audit
primitive: noul

state:
  cover_letter_text: "`context.cover_letter_text`"
  voice_register: "`context.voice_register`"

question: |
  Does the cover letter in cover_letter_text follow the voice_register professional voice standards and stay free of AI writing clichés (such as "I am writing to express my enthusiastic interest", "testament to", "delve", "leverage", "synergy"), corporate buzzword slop, and ungrounded flattery?

# P is P(clean). No escalate band: anything below accept returns to DRAFTING.
thresholds:
  accept: ">= 0.75"
  reject: "< 0.75"

failure_behavior: fail_closed

snap_on:
  judgment:
    type: predicate
    criterion: 'Does the cover letter in cover_letter_text follow the voice_register professional voice standards and stay free of AI writing clichés (such as "I am writing to express my enthusiastic interest", "testament to", "delve", "leverage", "synergy"), corporate buzzword slop, and ungrounded flattery?'
    min_probability: 0.75
    context_paths: [cover_letter_text, voice_register]
    include_payload: false
    fallback_adapter: script
    fallback_target: DRAFTING
