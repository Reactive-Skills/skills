# Judgment: Voice Standards and Anti-Slop Audit
primitive: noul

state:
  cover_letter_text: "`context.cover_letter_text`"
  voice_register: "`context.voice_register`"

question: |
  Does `state.cover_letter_text` adhere to `state.voice_register` professional voice standards and remain free of AI writing clichés (such as "I am writing to express my enthusiastic interest", "testament to", "delve", "leverage", "synergy"), corporate buzzword slop, and ungrounded flattery?

# P is P(clean). No escalate band: anything below accept returns to DRAFTING.
thresholds:
  accept: ">= 0.80"
  reject: "< 0.80"

failure_behavior: fail_closed

snap_on:
  judgment:
    type: predicate
    criterion: "Does the drafted application cover letter adhere to professional voice standards and remain free of AI clichés, generic buzzwords, or sycophantic corporate openings?"
    min_probability: 0.8
    fallback_adapter: script
    fallback_target: DRAFTING
