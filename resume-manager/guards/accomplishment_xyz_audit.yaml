# Judgment: Accomplishment XYZ Syntax Audit
primitive: noul

state:
  bullet_text: "`context.new_accomplishment`"

question: |
  Does `state.bullet_text` satisfy verb-first Google XYZ by opening with a strong past-tense verb other than "Accomplished", stating the result [X] with a quantified measurement [Y], and naming the specific engineering or operational method [Z], without an "as measured by" clause?

thresholds:
  accept: ">= 0.85"
  reject: "< 0.35"
  escalate: "0.35 – 0.85"

failure_behavior: fail_closed

snap_on:
  judgment:
    type: predicate
    criterion: "Is the achievement bullet verb-first Google XYZ, opening with a strong verb other than Accomplished, with a quantified measurement [Y] and a specific method [Z]?"
    min_confidence: 0.85
    fallback_adapter: script
    fallback_target: RECORD_ACCOMPLISHMENT
