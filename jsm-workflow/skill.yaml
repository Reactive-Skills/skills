schema_version: 2.1.0
name: jsm-workflow
version: 1.3.0
description: Reactive SDLC coordinator taking software changes from intake to final context sync, implementing the JS Mastery Engineering Workflow (https://jsmastery.com/skills).
initial_state: INIT
strict_execution: true
lifecycle_events:
  DECISION_REOPENED:
    description: Bubbled lifecycle event handled by ACTIVE when any active phase reopens a load bearing decision.
    target: ACTIVE.ARCHITECT
    record_updates:
      - decision_record.reopened_from
      - decision_record.reason
      - decision_record.downstream_work_to_rerun
  DOD_CHANGE_REQUESTED:
    description: Bubbled event for a requested change to an approved outcome contract.
    target: ACTIVE.DOD_AMENDMENT
    record_updates:
      - dod_record.pending_diff
      - dod_record.revision_reason
      - dod_record.downstream_work_to_rerun
context_schema:
  run_id:
    type: string
    description: Stable identifier for this lifecycle run.
  artifact_base:
    type: string
    default: .docs/jsm-workflow
    description: Base directory for projected lifecycle artifacts.
  work_request:
    type: object
    description: Intake summary, target area, outcome, constraints, assumptions, and blockers.
  scope_record:
    type: object
    description: Scoped slice, acceptance seeds, workflow tier, and next phase.
  decision_record:
    type: object
    description: Design decisions, requirement mapping, value sources, spec path, and ADR path when an ADR is warranted.
  context_record:
    type: object
    description: Root and area project context status plus any context edits or conflicts.
  build_record:
    type: object
    description: Implementation summary, changed files, self check, and decision gaps.
  verification_record:
    type: object
    description: Acceptance check results, failures, and deferred checks.
  test_record:
    type: object
    description: Test scope, tests written, command, result, and uncovered criteria.
  debug_record:
    type: object
    description: Symptom, reproduction, root cause, fix, and rerun evidence.
  review_record:
    type: object
    description: Reviewed diff, findings, missing tests, and residual risk.
  document_record:
    type: object
    description: Document type, evidence, output path, and audience.
  sync_record:
    type: object
    description: Durable context, scope, and spec reconciliation result.
  dod_record:
    type: object
    description: Approved outcome, deliverables, setup, boundaries, and itemized acceptance criteria.
  dod_audit_record:
    type: object
    description: Per-item check question, exact or semantic judgment, evidence, failure reason, and repair routing.
projections:
  intake:
    template: templates/intake.md.hbs
    output: "{{artifact_base}}/{{run_id}}/intake.md"
  lifecycle:
    template: templates/lifecycle.md.hbs
    output: "{{artifact_base}}/{{run_id}}/lifecycle.md"
  adr:
    template: templates/adr.md.hbs
    output: "{{artifact_base}}/{{run_id}}/adr.md"
  verification:
    template: templates/verification.md.hbs
    output: "{{artifact_base}}/{{run_id}}/verification.md"
  review:
    template: templates/review.md.hbs
    output: "{{artifact_base}}/{{run_id}}/review.md"
  handoff:
    template: templates/handoff.md.hbs
    output: "{{artifact_base}}/{{run_id}}/handoff.md"
  dod:
    template: templates/dod.md.hbs
    output: "{{artifact_base}}/{{run_id}}/dod.md"
states:
  INIT:
    description: Verify reactive runtime before any lifecycle work.
    prompt_template: states/init.md
    transitions:
      RUNTIME_READY:
        target: ACTIVE
      SETUP_REQUIRED:
        target: ERROR
  ACTIVE:
    description: Owns every nonterminal SDLC phase and handles lifecycle-wide decision reopening.
    initial_substate: INTAKE
    transitions:
      DECISION_REOPENED:
        target: ACTIVE.ARCHITECT
      DOD_CHANGE_REQUESTED:
        target: ACTIVE.DOD_AMENDMENT
    substates:
      INTAKE:
        description: Capture the work request, repo state, and completion target.
        prompt_template: states/intake.md
        transitions:
          WORK_REQUEST_READY:
            target: ACTIVE.SCOPE
          BUG_FIX_REQUESTED:
            target: ACTIVE.DOD_APPROVAL
          AUDIT_REQUESTED:
            target: ACTIVE.AUDIT
          DIRECT_BUILD_REQUESTED:
            target: ACTIVE.DOD_APPROVAL
          INTAKE_BLOCKED:
            target: BLOCKED
      SCOPE:
        description: Convert the request into ordered work with acceptance seeds.
        prompt_template: states/scope.md
        transitions:
          SCOPE_READY:
            target: ACTIVE.ARCHITECT
          SCOPE_ONLY:
            target: ACTIVE.DOD_APPROVAL
          SCOPE_BLOCKED:
            target: BLOCKED
      ARCHITECT:
        description: Settle load bearing design decisions before implementation.
        prompt_template: states/architect.md
        transitions:
          SPEC_READY:
            target: ACTIVE.AUDIT
          DOD_AMENDMENT_REQUIRED:
            target: ACTIVE.DOD_AMENDMENT
          DECISION_DEFERRED:
            target: BLOCKED
          DESIGN_FLAW_CONFIRMED:
            target: ACTIVE.SCOPE
      AUDIT:
        description: Ensure durable project context exists and matches the work area.
        prompt_template: states/audit.md
        transitions:
          CONTEXT_READY:
            target: ACTIVE.DOD_APPROVAL
          CONTEXT_REFRESHED:
            target: ACTIVE.DEVELOP
          AUDIT_TO_SCOPE:
            target: ACTIVE.SCOPE
          CONTEXT_BLOCKED:
            target: BLOCKED
      DOD_APPROVAL:
        description: Present the complete outcome contract and collect one approval before implementation.
        prompt_template: states/dod_approval.md
        human_gate:
          type: choice
          tool: ask_question
          options:
            - Approve DoD
            - Request DoD Changes
            - Stop
        transitions:
          USER_APPROVED:
            target: ACTIVE.DEVELOP
            guardFunction: guards/dod-structure.cjs
          USER_REVISION_REQUESTED:
            target: ACTIVE.DOD_APPROVAL
          USER_REJECTED:
            target: BLOCKED
      DOD_AMENDMENT:
        description: Approve a focused DoD diff after an accepted outcome or load-bearing decision changes.
        prompt_template: states/dod_amendment.md
        human_gate:
          type: choice
          tool: ask_question
          options:
            - Approve DoD Diff
            - Request DoD Changes
            - Stop
        transitions:
          USER_APPROVED:
            target: ACTIVE.AUDIT
            guardFunction: guards/dod-structure.cjs
          USER_REVISION_REQUESTED:
            target: ACTIVE.DOD_AMENDMENT
          USER_REJECTED:
            target: BLOCKED
      DOD_AUDIT:
        description: Check every approved criterion, capture evidence, and route failures for repair.
        prompt_template: states/dod_audit.md
        transitions:
          DOD_CHECK_SUBMITTED:
            target: ACTIVE.DOD_AUDIT
            judgment:
              type: predicate
              criterion: "Does the delivered output satisfy the single approved assertion in `event.contextUpdates.dod_record.active_check.question` (or `context.dod_record.active_check.question` when this signal omits it), based only on that check's `expected_result` and `evidence`?"
              # The runtime scores a Jev predicate as confidence = |2p - 1|, so 0.70 passes a true verdict at probability p >= 0.85.
              min_confidence: 0.70
              adapter_hint: jev
              fallback_target: ACTIVE.DEVELOP
          DOD_AUDIT_PASSED:
            target: COMPLETE
            # Guards read the stored context before this signal's contextUpdates merge, so check the record this signal would store.
            guard: "(record => Boolean(record) && Array.isArray(record.criteria) && record.criteria.length > 0 && record.criteria.every(item => item && item.status === 'passed' && typeof item.evidence === 'string' && item.evidence.trim().length > 0))((payload.contextUpdates && payload.contextUpdates.dod_record) || context.dod_record)"
          DOD_AUDIT_REPAIR_REQUIRED:
            target: ACTIVE.DEVELOP
          DOD_AUDIT_BLOCKED:
            target: BLOCKED
      DEVELOP:
        description: Implement the scoped and designed change.
        prompt_template: states/develop.md
        transitions:
          DEBUG_NEEDED:
            target: ACTIVE.DEBUG
          BUILD_SKIPPED:
            target: ACTIVE.DOD_AUDIT
          BUILD_READY:
            target: ACTIVE.VERIFY
          DECISION_NEEDED:
            target: ACTIVE.ARCHITECT
          BUILD_FAILED:
            target: ACTIVE.DEBUG
      VERIFY:
        description: Prove behavior in the real product or service.
        prompt_template: states/verify.md
        transitions:
          VERIFY_PASSED:
            target: ACTIVE.TEST
          VERIFY_FAILED:
            target: ACTIVE.DEBUG
          VERIFY_DEFERRED:
            target: ACTIVE.TEST
      TEST:
        description: Write or update tests for durable behavior.
        prompt_template: states/test.md
        transitions:
          TEST_PASSED:
            target: ACTIVE.REVIEW
          TEST_FAILED:
            target: ACTIVE.DEBUG
          TEST_DEFERRED:
            target: ACTIVE.REVIEW
      DEBUG:
        description: Reproduce failures, prove the root cause, apply the smallest fix, and verify it.
        prompt_template: states/debug.md
        transitions:
          BUG_FIXED:
            target: ACTIVE.VERIFY
            # Three repair attempts per failure: the attempt must follow the stored one for the same failure_id, or restart at 1.
            guard: "((prev, next) => Boolean(next) && typeof next.failure_id === 'string' && next.failure_id.trim().length > 0 && typeof next.failure_evidence === 'string' && next.failure_evidence.trim().length > 0 && next.attempt === (prev && prev.failure_id === next.failure_id ? Number(prev.attempt) || 0 : 0) + 1 && next.attempt <= 3)(context.debug_record, payload.contextUpdates && payload.contextUpdates.debug_record)"
          DESIGN_FLAW:
            target: ACTIVE.ARCHITECT
          DEBUG_BLOCKED:
            target: BLOCKED
      REVIEW:
        description: Review the diff for defects, risks, and missed requirements.
        prompt_template: states/review.md
        transitions:
          REVIEW_PASSED:
            target: ACTIVE.DOCUMENT
            # Only the signal's own record counts, so a stale review from an earlier pass cannot satisfy a new one.
            guard: "(reviewer => Boolean(reviewer) && reviewer.isolation === 'fresh_context' && typeof reviewer.agent === 'string' && reviewer.agent.trim().length > 0)(((payload.contextUpdates && payload.contextUpdates.review_record) || {}).reviewer)"
          REVIEW_FINDINGS:
            target: ACTIVE.DEVELOP
          REVIEW_DEFERRED:
            target: ACTIVE.DOCUMENT
      DOCUMENT:
        description: Write human facing change prose from evidence.
        prompt_template: states/document.md
        transitions:
          DOCUMENTED:
            target: ACTIVE.SYNC
          DOCUMENT_DEFERRED:
            target: ACTIVE.SYNC
      SYNC:
        description: Reconcile durable context, scope status, and decision status from repo evidence.
        prompt_template: states/sync.md
        transitions:
          SYNCED:
            target: ACTIVE.DOD_AUDIT
          SYNC_BLOCKED:
            target: BLOCKED
  COMPLETE:
    description: Report success after every approved DoD criterion passes with evidence.
    prompt_template: states/complete.md
  BLOCKED:
    description: Report blocked or stopped work and its unmet DoD item or missing decision.
    prompt_template: states/blocked.md
  ERROR:
    description: Runtime setup failed or execution became unsafe.
    prompt_template: states/error.md
  BYPASS_DETECTED:
    description: Bypass detected because execution moved outside the signal contract.
    prompt_template: states/bypass_detected.md
