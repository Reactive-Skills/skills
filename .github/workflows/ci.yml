name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-engine:
    name: Test Go Mutation Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go Tests
        run: |
          if [ -f "go.mod" ]; then
            go test -v -race ./...
          elif [ -d "mutation-tester/engine" ]; then
            cd mutation-tester/engine && go test -v -race ./...
          fi

  validate-skill:
    name: Validate Reactive Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Reactive Skill Validation
        run: node scripts/validate-skills.js

      - name: Test skill-manager evaluation evidence
        run: node --test skill-manager/tests/evals.test.cjs skill-manager/tests/run-cli.test.cjs

      - name: Test portable authoring checks
        run: node --test skill-manager/tests/authoring-quality.test.cjs

      - name: Validate offline evaluation records
        run: node skill-manager/evals/validate-evals.cjs --mode structure --json

      - name: Test Table of Contents generator
        run: node --test scripts/update-toc.test.js

      - name: Verify Table of Contents
        run: node scripts/update-toc.js --check

      - name: Install Reactive Skills runtime
        run: npm install --global @reactive-skills/axi@0.19.0

      - name: Test skill guards
        run: node --test */guards/*.test.cjs */guards/*.test.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install resume-manager test dependencies
        run: python -m pip install python-docx==1.2.0

      - name: Test resume-manager DOCX export
        run: python -m unittest discover -s resume-manager/tests

  validate-skill-releases:
    name: Validate Skill Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release manifests and version changes
        run: node scripts/validate-skill-releases.js --base-ref "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
