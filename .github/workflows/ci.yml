name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-engine:
    name: Test Go Mutation Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run Go Tests
        run: |
          if [ -f "go.mod" ]; then
            go test -v -race ./...
          elif [ -d "mutation-tester/engine" ]; then
            cd mutation-tester/engine && go test -v -race ./...
          fi

  validate-skill:
    name: Validate Reactive Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Reactive Skill Validation
        run: node scripts/validate-skills.js

      - name: Test skill-manager evaluation evidence
        run: node --test skill-manager/tests/evals.test.cjs skill-manager/tests/run-cli.test.cjs

      - name: Test portable authoring checks
        run: node --test skill-manager/tests/authoring-quality.test.cjs

      - name: Validate offline evaluation records
        run: node skill-manager/evals/validate-evals.cjs --mode structure --json

      - name: Test Table of Contents generator
        run: node --test scripts/update-toc.test.js

      - name: Verify Table of Contents
        run: node scripts/update-toc.js --check

      - name: Install Reactive Skills runtime
        run: npm install --global @reactive-skills/axi@0.17.3

      - name: Test skill guards
        run: node --test */guards/*.test.cjs */guards/*.test.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install resume-manager test dependencies
        run: python -m pip install python-docx==1.2.0

      - name: Test resume-manager DOCX export
        run: python -m unittest discover -s resume-manager/tests

  validate-skill-releases:
    name: Validate Skill Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release manifests and version changes
        run: node scripts/validate-skill-releases.js --base-ref "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

  vet-skills:
    name: Vet Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Reactive Skills runtime
        run: npm install --global @reactive-skills/axi@0.19.0

      - name: Select skills to vet
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          all=$(for f in */skill.yaml; do dirname "$f"; done)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            # A change to the allowlist or this workflow can affect every skill.
            if printf '%s\n' "$changed" | grep -qxE '\.vet-allowlist\.yaml|\.github/workflows/ci\.yml'; then
              skills=$all
            else
              skills=$(printf '%s\n' "$changed" | cut -d/ -f1 | sort -u | while read -r d; do
                [ -f "$d/skill.yaml" ] && echo "$d" || true
              done)
            fi
          else
            skills=$all
          fi
          echo "Skills to vet:"; printf '%s\n' "$skills"
          echo "skills<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$skills" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Vet skills
        env:
          SKILLS: ${{ steps.select.outputs.skills }}
        run: |
          mkdir -p vet-report
          status=0
          for skill in $SKILLS; do
            code=0
            reactive-skills-axi vet "$skill" --allowlist .vet-allowlist.yaml --fail-on high --json > "vet-report/$skill.json" || code=$?
            echo "::group::vet $skill (exit $code)"
            reactive-skills-axi vet "$skill" --allowlist .vet-allowlist.yaml --fail-on high || true
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          exit $status

      - name: Upload vet report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vet-report
          path: vet-report/
          if-no-files-found: ignore
